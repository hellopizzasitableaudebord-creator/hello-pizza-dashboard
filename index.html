<!DOCTYPE html>
<html lang="fr" class="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Pizza - Tableau de Bord</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-body: #f1f5f9; --text-main: #1e293b; --bg-card: #ffffff;
            --border-color: #e2e8f0; --text-muted: #64748b; --bg-input: #f8fafc;
        }
        html.dark {
            --bg-body: #0f172a; --text-main: #f1f5f9; --bg-card: #1e293b;
            --border-color: #334155; --text-muted: #94a3b8; --bg-input: #0f172a;
        }
        body {
            background-color: var(--bg-body) !important; color: var(--text-main) !important;
            transition: background-color 0.3s, color 0.3s; font-family: 'Segoe UI', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, p, span, td, th, label, div { color: inherit; }
        .card { background-color: var(--bg-card) !important; border: 1px solid var(--border-color) !important; border-radius: 0.5rem; transition: all 0.3s; }
        .text-muted { color: var(--text-muted) !important; }
        .input-field, select { background-color: var(--bg-input) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; }
        
        .tab-active { background-color: #10b981 !important; color: white !important; border: 1px solid #10b981 !important;}
        .tab-inactive { background-color: transparent !important; color: var(--text-muted) !important; border: 1px solid var(--border-color) !important; }
        .tab-inactive:hover { background-color: var(--bg-input) !important; }

        .filter-btn { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; border: 1px solid var(--border-color); cursor: pointer; font-weight: bold; color: var(--text-muted); }
        .filter-btn.active { background-color: #3b82f6 !important; color: white !important; border-color: #3b82f6 !important; }

        .formula { font-size: 0.75rem; padding: 0.5rem; border-radius: 0.25rem; margin-bottom: 1rem; border-left: 3px solid #3b82f6; background-color: var(--bg-input); color: var(--text-muted); font-style: italic; }
        html[dir="rtl"] .formula { border-left: none; border-right: 3px solid #3b82f6; }
        .chart-container { position: relative; height: 320px; width: 100%; }
        
        .lang-btn { padding: 0.2rem 0.5rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: 1px solid var(--border-color); }
        .lang-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <!-- ================= CONNEXION ================= -->
    <div id="login-screen" class="flex items-center justify-center h-screen relative">
        
        <div class="absolute top-6 right-6 flex gap-3 items-center">
            <div class="flex gap-1 bg-gray-200 dark:bg-gray-800 p-1 rounded">
                <button class="lang-btn active" onclick="changeLang('fr')">FR</button>
                <button class="lang-btn" onclick="changeLang('en')">EN</button>
                <button class="lang-btn" onclick="changeLang('ar')">AR</button>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded bg-gray-200 dark:bg-gray-800 text-xl border border-gray-300 dark:border-gray-600" title="Thème">🌓</button>
        </div>

        <div class="card w-full max-w-md p-8 shadow-2xl">
            <h1 class="text-3xl font-bold text-emerald-500 mb-2 text-center" data-i18n="app_title"></h1>
            <p class="text-muted mb-6 text-center text-sm" data-i18n="app_subtitle"></p>
            
            <div class="flex justify-center mb-6 border-b border-gray-300 dark:border-gray-700">
                <div id="tab-login" class="cursor-pointer px-4 py-2 border-b-2 border-emerald-500 text-emerald-500 font-bold" onclick="switchAuth('login')" data-i18n="tab_login"></div>
                <div id="tab-signup" class="cursor-pointer px-4 py-2 text-muted" onclick="switchAuth('signup')" data-i18n="tab_signup"></div>
            </div>

            <form id="form-login" onsubmit="event.preventDefault(); login();">
                <input type="text" id="login-email" name="email" autocomplete="username" class="w-full p-3 mb-3 rounded input-field focus:outline-none focus:border-emerald-500" data-i18n-placeholder="ph_email">
                <div class="relative mb-3">
                    <input type="password" id="login-password" name="password" autocomplete="current-password" class="w-full p-3 pr-10 rounded input-field focus:outline-none focus:border-emerald-500" data-i18n-placeholder="ph_password">
                    <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none" title="Afficher/Masquer">👁️</button>
                </div>
                <div class="flex items-center mb-4">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 text-emerald-600 bg-gray-100 border-gray-300 rounded focus:ring-emerald-500 dark:focus:ring-emerald-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                    <label for="remember-me" class="ml-2 text-sm font-medium text-muted" data-i18n="remember_me"></label>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded transition" data-i18n="btn_login"></button>
                <p id="error-msg" class="text-red-500 text-sm mt-3 text-center hidden font-bold" data-i18n="error_login"></p>
            </form>

            <form id="form-signup" class="hidden" onsubmit="event.preventDefault(); register();">
                <input type="text" id="reg-name" name="name" autocomplete="name" class="w-full p-3 mb-3 rounded input-field" data-i18n-placeholder="ph_name">
                <input type="email" id="reg-email" name="email" autocomplete="email" class="w-full p-3 mb-3 rounded input-field" data-i18n-placeholder="ph_email">
                <div class="relative mb-4">
                    <input type="password" id="reg-password" name="new-password" autocomplete="new-password" class="w-full p-3 pr-10 rounded input-field" data-i18n-placeholder="ph_password">
                    <button type="button" onclick="togglePasswordVisibility('reg-password')" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none">👁️</button>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition" data-i18n="btn_signup"></button>
            </form>
        </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div id="dashboard-screen" class="hidden max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-gray-300 dark:border-gray-700 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-500" data-i18n="dash_title"></h1>
                <p class="text-sm text-muted"><span data-i18n="connected_as"></span> : <span id="user-display" class="font-bold"></span> | M0 = Sept. 2026</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                
                <div class="flex gap-1 bg-gray-200 dark:bg-gray-800 p-1 rounded">
                    <button class="lang-btn active" onclick="changeLang('fr')">FR</button>
                    <button class="lang-btn" onclick="changeLang('en')">EN</button>
                    <button class="lang-btn" onclick="changeLang('ar')">AR</button>
                </div>

                <button onclick="toggleTheme()" class="p-2 rounded bg-gray-200 dark:bg-gray-800 text-xl border border-gray-300 dark:border-gray-600" title="Thème">🌓</button>
                
                <button onclick="exportData('xlsx')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-bold transition" data-i18n="btn_export"></button>
                <button onclick="syncData()" id="sync-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition">
                    <span id="sync-icon">🔄</span> <span id="sync-text" data-i18n="btn_sync"></span>
                </button>
                <button onclick="openTargetModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded text-sm font-bold transition" data-i18n="btn_targets"></button>
                <button onclick="openHistoryModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-bold transition" data-i18n="btn_history"></button>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm" data-i18n="btn_logout"></button>
            </div>
        </header>

        <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="switchTab('gerant')" id="tab-gerant" class="px-4 py-2 rounded font-semibold tab-active transition" data-i18n="tab_manager"></button>
            <button onclick="switchTab('ventes')" id="tab-ventes" class="px-4 py-2 rounded font-semibold tab-inactive transition" data-i18n="tab_sales"></button>
            <button onclick="switchTab('achat')" id="tab-achat" class="px-4 py-2 rounded font-semibold tab-inactive transition" data-i18n="tab_purchases"></button>
            <button onclick="switchTab('prepa')" id="tab-prepa" class="px-4 py-2 rounded font-semibold tab-inactive transition" data-i18n="tab_prep"></button>
            <button onclick="switchTab('service')" id="tab-service" class="px-4 py-2 rounded font-semibold tab-inactive transition" data-i18n="tab_service"></button>
        </div>

        <div id="content-gerant" class="process-content space-y-6"></div>
        <div id="content-ventes" class="process-content hidden space-y-6"></div>
        <div id="content-achat" class="process-content hidden space-y-6"></div>
        <div id="content-prepa" class="process-content hidden space-y-6"></div>
        <div id="content-service" class="process-content hidden space-y-6"></div>
    </div>

    <!-- MODAL CIBLES -->
    <div id="target-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50">
        <div class="card w-full max-w-2xl p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold text-amber-500 mb-4" data-i18n="modal_targets_title"></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 bg-gray-100 dark:bg-gray-800 p-3 rounded">
                <div>
                    <label class="text-xs font-bold text-muted block mb-1" data-i18n="lbl_process"></label>
                    <select id="edit-process" class="w-full p-2 rounded border input-field font-bold" onchange="updateModalInputs()">
                        <option value="tous" data-i18n="opt_all"></option>
                        <option value="ventes" data-i18n="tab_sales"></option>
                        <option value="achat" data-i18n="tab_purchases"></option>
                        <option value="prepa" data-i18n="tab_prep"></option>
                        <option value="service" data-i18n="tab_service"></option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-muted block mb-1" data-i18n="lbl_month"></label>
                    <select id="edit-month" class="w-full p-2 rounded border input-field font-bold" onchange="updateModalInputs()"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-muted block mb-1" data-i18n="lbl_category"></label>
                    <div class="flex gap-1">
                        <button class="filter-btn active flex-1" data-filter="all" onclick="setModalFilter('all')" data-i18n="opt_all"></button>
                        <button class="filter-btn flex-1" data-filter="major" onclick="setModalFilter('major')" data-i18n="opt_major"></button>
                        <button class="filter-btn flex-1" data-filter="sub" onclick="setModalFilter('sub')" data-i18n="opt_sub"></button>
                    </div>
                </div>
            </div>
            <div id="target-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
            <div class="flex justify-end gap-3 border-t border-gray-200 dark:border-gray-700 pt-4">
                <button onclick="closeTargetModal()" class="px-4 py-2 text-muted font-bold hover:text-red-500" data-i18n="btn_cancel"></button>
                <button onclick="saveTargets()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded font-bold" data-i18n="btn_save"></button>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORIQUE -->
    <div id="history-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50">
        <div class="card w-full max-w-3xl p-6 shadow-2xl overflow-y-auto max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 border-b border-gray-300 dark:border-gray-700 pb-2">
                <h2 class="text-xl font-bold" data-i18n="modal_history_title"></h2>
                <button onclick="closeHistoryModal()" class="text-red-500 hover:text-red-700 font-bold bg-red-100 dark:bg-red-900/30 px-3 py-1 rounded" data-i18n="btn_close"></button>
            </div>
            <div id="history-content" class="space-y-4"></div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>

                tab_manager: "Manager Summary", tab_sales: "Sales", tab_purchases: "Purchases", tab_prep: "Preparation", tab_service: "Service",

                remember_me: "تذكرني", btn_login: "دخول", error_login: "بيانات غير صحيحة.", btn_signup: "تسجيل",
                dash_title: "Hello Pizza — لوحة القيادة", connected_as: "متصل", btn_export: "📤 تصدير إكسيل", btn_sync: "مزامنة",
                btn_targets: "⚙️ الأهداف", btn_history: "📜 السجل", btn_logout: "خروج",
                tab_manager: "ملخص المدير", tab_sales: "المبيعات", tab_purchases: "المشتريات", tab_prep: "التحضير", tab_service: "الخدمة",

                a_rupt_c_title: "نفاد المواد الخام الحرجة", a_rupt_c_formula: "(المواد الحرجة المنتهية / إجمالي المواد الحرجة) × 100",
                a_stock_title: "المواد الخام المحققة للحد الأدنى", a_stock_formula: "(المواد المحققة للحد الأدنى / إجمالي المواد) × 100",
                p_temps_title: "متوسط وقت التحضير", p_temps_formula: "مجموع أوقات التحضير / إجمالي الأطباق المحضرة",
                p_retard_title: "معدل الطلبات المتأخرة", p_retard_formula: "(الطلبات المتأخرة / إجمالي الطلبات) × 100",

                s_reclam_title: "معدل الشكاوى", s_reclam_formula: "(الشكاوى / إجمالي الأطباق المقدمة) × 100",

        let currentLang = 'fr';

        function t(key) { return i18n[currentLang][key] || key; }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
        }

        function changeLang(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', lang);
            }

            applyTranslations();
            
            if (!document.getElementById('dashboard-screen').classList.contains('hidden')) {
                renderAll();
            }
        }

        function generateTargets(m0, m12) { let arr = [m0]; for(let i=1; i<=12; i++) arr.push(m0 + (m12 - m0) * (i / 12)); return arr; }

        // --- SUPPRESSION DE cumulType, ON SE BASE SUR L'UNITE ---
        const appData = {
            ventes: [
                { id: 'v_ca', unit: 'DH', m0: 32940, m1: 22104, targets: generateTargets(32940, 44466), isReverse: false, isMajor: true },
                { id: 'v_cmd', unit: 'cmd', m0: 540, m1: 359, targets: generateTargets(540, 648), isReverse: false, isMajor: false },
                { id: 'v_ticket', unit: 'DH', m0: 61.00, m1: 61.57, targets: generateTargets(61, 68.62), isReverse: false, isMajor: false }
            ],
            achat: [
                { id: 'a_rupt_nc', unit: '%', m0: 8.93, m1: 8.93, targets: generateTargets(8.93, 3.57), isReverse: true, isMajor: false },
                { id: 'a_rupt_c', unit: '%', m0: 16.6, m1: 16.6, targets: generateTargets(16.6, 0), isReverse: true, isMajor: false },
                { id: 'a_stock', unit: '%', m0: 89.71, m1: 89.71, targets: generateTargets(89.71, 95), isReverse: false, isMajor: true }
            ],
            prepa: [
                { id: 'p_temps', unit: 'min', m0: 20, m1: 20, targets: generateTargets(20, 15), isReverse: true, isMajor: true },
                { id: 'p_retard', unit: '%', m0: 10.0, m1: 9.0, targets: generateTargets(10, 5), isReverse: true, isMajor: false }
            ],
            service: [
                { id: 's_retours', unit: 'retours', m0: 15, m1: 26, targets: generateTargets(15, 30), isReverse: false, isMajor: false },
                { id: 's_reclam', unit: '%', m0: 5.0, m1: 4.5, targets: generateTargets(5, 3), isReverse: true, isMajor: false },
                { id: 's_indice', unit: 'pts', m0: 72.5, m1: 73.5, targets: generateTargets(72.5, 82.5), isReverse: false, isMajor: true }
            ]
        };

        let charts = {};
        let changeHistory = JSON.parse(localStorage.getItem('hp_history')) || [];
        let currentModalMonth = 12, currentModalFilter = 'all', currentModalProcess = 'tous';

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
        }

        function switchAuth(mode) { 
            document.getElementById('tab-login').className = mode === 'login' ? 'cursor-pointer px-4 py-2 border-b-2 border-emerald-500 text-emerald-500 font-bold' : 'cursor-pointer px-4 py-2 text-muted';
            document.getElementById('tab-signup').className = mode === 'signup' ? 'cursor-pointer px-4 py-2 border-b-2 border-emerald-500 text-emerald-500 font-bold' : 'cursor-pointer px-4 py-2 text-muted';
            document.getElementById('form-login').classList.toggle('hidden', mode !== 'login');
            document.getElementById('form-signup').classList.toggle('hidden', mode !== 'signup');
        }
        function register() { 
            const name = document.getElementById('reg-name').value, email = document.getElementById('reg-email').value, pass = document.getElementById('reg-password').value;
            if (!name || !email || !pass) return alert("Remplissez tout.");
            let users = JSON.parse(localStorage.getItem('hp_users')) || {}; users[email] = { name, password: pass };
            localStorage.setItem('hp_users', JSON.stringify(users)); alert("Compte créé !"); switchAuth('login');
        }
        function login() { 
            const email = document.getElementById('login-email').value, pass = document.getElementById('login-password').value;
            if (email === 'admin' && pass === 'admin') { showDashboard("Admin"); return; }
            let users = JSON.parse(localStorage.getItem('hp_users')) || {};
            if (users[email] && users[email].password === pass) { showDashboard(users[email].name); }
            else { document.getElementById('error-msg').classList.remove('hidden'); }
        }
        function showDashboard(name) { 
            document.getElementById('user-display').innerText = name;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden'); renderAll();
        }
        function logout() { location.reload(); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); 
            if (!document.getElementById('dashboard-screen').classList.contains('hidden')) { renderAll(); } 
        }
        function switchTab(tab) {
            document.querySelectorAll('.process-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.querySelectorAll('[id^="tab-"]').forEach(el => { if(!el.id.includes('login')) { el.classList.remove('tab-active'); el.classList.add('tab-inactive'); } });
            document.getElementById('tab-' + tab).classList.remove('tab-inactive'); document.getElementById('tab-' + tab).classList.add('tab-active');
        }

        function renderAll() {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#475569';
            const gridColor = isDark ? '#334155' : '#e2e8f0';
            
            const monthSelect = document.getElementById('edit-month');
            if(monthSelect) {
                monthSelect.innerHTML = '';
                for(let i=1; i<=12; i++) {
                    let opt = document.createElement('option'); opt.value = i; opt.text = 'M' + i;
                    if(i === currentModalMonth) opt.selected = true; monthSelect.appendChild(opt);
                }
            }

            // 1. Gérant
            document.getElementById('content-gerant').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                    <div class="card p-6 border-t-4 border-blue-500">
                        <p class="text-xs font-bold text-muted uppercase">${t('v_ca_annual')} (M0)</p>
                        <h3 class="text-3xl font-bold mt-2">${appData.ventes[0].m0.toLocaleString()} <span class="text-sm font-normal">DH</span></h3>
                        <p class="text-sm text-muted mt-2">${t('target_m12')} : ${appData.ventes[0].targets[12].toLocaleString()} DH</p>
                    </div>
                    <div class="card p-6 border-t-4 border-emerald-500">
                        <p class="text-xs font-bold text-muted uppercase">${t(appData.achat[2].id + '_title')} (M0)</p>
                        <h3 class="text-3xl font-bold mt-2">${appData.achat[2].m0} <span class="text-sm font-normal">%</span></h3>
                        <p class="text-sm text-muted mt-2">${t('target_m12')} : ${appData.achat[2].targets[12].toFixed(1)} %</p>
                    </div>
                    <div class="card p-6 border-t-4 border-amber-500">
                        <p class="text-xs font-bold text-muted uppercase">${t(appData.prepa[0].id + '_title')} (M0)</p>
                        <h3 class="text-3xl font-bold mt-2">${appData.prepa[0].m0} <span class="text-sm font-normal">min</span></h3>
                        <p class="text-sm text-muted mt-2">${t('target_m12')} : ${appData.prepa[0].targets[12].toFixed(1)} min</p>
                    </div>
                    <div class="card p-6 border-t-4 border-purple-500">
                        <p class="text-xs font-bold text-muted uppercase">${t(appData.service[2].id + '_title')} (M0)</p>
                        <h3 class="text-3xl font-bold mt-2">${appData.service[2].m0} <span class="text-sm font-normal">pts</span></h3>
                        <p class="text-sm text-muted mt-2">${t('target_m12')} : ${appData.service[2].targets[12].toFixed(1)} pts</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <h3 class="text-lg font-bold">${t('v_ca_annual')}</h3>
                        <p class="text-sm text-muted mb-2">${t('actual_m1')}: <span class="font-bold text-emerald-500">${appData.ventes[0].m1} ${appData.ventes[0].unit}</span> | ${t('target_m12')}: ${appData.ventes[0].targets[12].toFixed(2)} ${appData.ventes[0].unit}</p>
                        <div class="formula">${t(appData.ventes[0].id + '_formula')}</div>
                        <div class="chart-container"><canvas id="chart-gerant-v_ca"></canvas></div>
                    </div>
                    <div class="card p-6">
                        <h3 class="text-lg font-bold">${t(appData.achat[2].id + '_title')}</h3>
                        <p class="text-sm text-muted mb-2">${t('actual_m1')}: <span class="font-bold text-emerald-500">${appData.achat[2].m1} ${appData.achat[2].unit}</span> | ${t('target_m12')}: ${appData.achat[2].targets[12].toFixed(2)} ${appData.achat[2].unit}</p>
                        <div class="formula">${t(appData.achat[2].id + '_formula')}</div>
                        <div class="chart-container"><canvas id="chart-gerant-a_stock"></canvas></div>
                    </div>
                    <div class="card p-6">
                        <h3 class="text-lg font-bold">${t(appData.prepa[0].id + '_title')}</h3>
                        <p class="text-sm text-muted mb-2">${t('actual_m1')}: <span class="font-bold text-emerald-500">${appData.prepa[0].m1} ${appData.prepa[0].unit}</span> | ${t('target_m12')}: ${appData.prepa[0].targets[12].toFixed(2)} ${appData.prepa[0].unit}</p>
                        <div class="formula">${t(appData.prepa[0].id + '_formula')}</div>
                        <div class="chart-container"><canvas id="chart-gerant-p_temps"></canvas></div>
                    </div>
                    <div class="card p-6">
                        <h3 class="text-lg font-bold">${t(appData.service[2].id + '_title')}</h3>
                        <p class="text-sm text-muted mb-2">${t('actual_m1')}: <span class="font-bold text-emerald-500">${appData.service[2].m1} ${appData.service[2].unit}</span> | ${t('target_m12')}: ${appData.service[2].targets[12].toFixed(2)} ${appData.service[2].unit}</p>
                        <div class="formula">${t(appData.service[2].id + '_formula')}</div>
                        <div class="chart-container"><canvas id="chart-gerant-s_indice"></canvas></div>
                    </div>
                </div>`;

            // 2. Processus
            const buildProcessHtml = (processKey) => {
                let html = ''; appData[processKey].forEach(ind => {
                    html += `<div class="card p-6 mb-6"><h3 class="text-lg font-bold">${t(ind.id + '_title')}</h3><p class="text-sm text-muted mb-2">${t('actual_m1')}: <span class="font-bold text-emerald-500">${ind.m1} ${ind.unit}</span> | ${t('target_m12')}: ${ind.targets[12].toFixed(2)} ${ind.unit}</p><div class="formula">${t(ind.id + '_formula')}</div><div class="chart-container"><canvas id="chart-${ind.id}"></canvas></div></div>`;
                }); return html;
            };
            document.getElementById('content-ventes').innerHTML = buildProcessHtml('ventes');
            document.getElementById('content-achat').innerHTML = buildProcessHtml('achat');
            document.getElementById('content-prepa').innerHTML = buildProcessHtml('prepa');
            document.getElementById('content-service').innerHTML = buildProcessHtml('service');

            // 3. Charts
            Object.values(charts).forEach(c => c.destroy()); charts = {};

            const create3Axis = (canvasId, ind) => {
                const ctx = document.getElementById(canvasId).getContext('2d');
                let realised = [], cumulated = [];

                for (let i = 0; i <= 12; i++) {
                    if (i === 0) { realised.push(ind.m0); }
                    else if (i === 1) { realised.push(ind.m1); }
                    else { realised.push(null); }

                    if (i === 0) {
                        cumulated.push(ind.m0);
                    } else if (i === 1) {
                        // --- LA LOGIQUE EST MAINTENANT BASÉE SUR L'UNITÉ ---
                        if (ind.id === 'v_ticket') {
                            // Ticket Moyen = CA total / Commandes totales
                            const caTotal = appData.ventes[0].m0 + appData.ventes[0].m1;
                            const cmdTotal = appData.ventes[1].m0 + appData.ventes[1].m1;
                            cumulated.push((caTotal / cmdTotal).toFixed(2));
                        } else if (ind.unit === '%' || ind.unit === 'min' || ind.unit === 'pts') {
                            // Les pourcentages, temps et indices (points) sont des moyennes
                            cumulated.push(((ind.m0 + ind.m1) / 2).toFixed(2));
                        } else {
                            // Les volumes (DH, commandes, retours) sont des sommes
                            cumulated.push((ind.m0 + ind.m1).toFixed(2));
                        }
                    } else {
                        cumulated.push(null);
                    }
                }

                let cumulLabel = t('chart_cumul');
                if (ind.id === 'v_ticket') cumulLabel = t('ticket_cumul');
                else if (ind.unit === '%' || ind.unit === 'min' || ind.unit === 'pts') cumulLabel = t('chart_avg_cumul');

                return new Chart(ctx, {
                    type: 'bar',
                    data: { labels: ['M0','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'], datasets: [
                        { type: 'bar', label: t('chart_actual'), data: realised, backgroundColor: '#10b981', yAxisID: 'y', order: 3 },
                        { type: 'bar', label: t('chart_target'), data: ind.targets, backgroundColor: '#3b82f6', yAxisID: 'y', order: 2 },
                        { type: 'line', label: cumulLabel, data: cumulated, borderColor: '#f97316', backgroundColor: '#f97316', pointBackgroundColor: '#fff', pointBorderColor: '#f97316', yAxisID: 'y1', order: 1, borderWidth: 2, spanGaps: false }
                    ]},
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        plugins: { legend: { labels: { color: textColor } } }, 
                        scales: { 
                            x: { title: { display: true, text: t('chart_month'), color: textColor }, ticks: { color: textColor }, grid: { color: gridColor } }, 
                            y: { position: 'left', title: { display: true, text: `${t('chart_monthly_val')} (${ind.unit})`, color: textColor }, ticks: { color: textColor }, grid: { color: gridColor }, grace: '20%' }, 
                            y1: { position: 'right', title: { display: true, text: `${cumulLabel} (${ind.unit})`, color: textColor }, ticks: { color: textColor }, grid: { drawOnChartArea: false }, grace: '20%' } 
                        } 
                    }
                });
            };

            charts['gerant-v_ca'] = create3Axis('chart-gerant-v_ca', appData.ventes[0]);
            charts['gerant-a_stock'] = create3Axis('chart-gerant-a_stock', appData.achat[2]);
            charts['gerant-p_temps'] = create3Axis('chart-gerant-p_temps', appData.prepa[0]);
            charts['gerant-s_indice'] = create3Axis('chart-gerant-s_indice', appData.service[2]);

            appData.ventes.forEach(i => charts[i.id] = create3Axis(`chart-${i.id}`, i));
            appData.achat.forEach(i => charts[i.id] = create3Axis(`chart-${i.id}`, i));
            appData.prepa.forEach(i => charts[i.id] = create3Axis(`chart-${i.id}`, i));
            appData.service.forEach(i => charts[i.id] = create3Axis(`chart-${i.id}`, i));
        }

        // --- MODALES ET EXPORT ---
        function openTargetModal() {
            document.getElementById('target-modal').classList.remove('hidden'); updateModalInputs();
        }
        function closeTargetModal() { document.getElementById('target-modal').classList.add('hidden'); }
        function setModalFilter(filter) { currentModalFilter = filter; document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter)); updateModalInputs(); }
        function updateModalInputs() {
            currentModalMonth = parseInt(document.getElementById('edit-month').value);
            currentModalProcess = document.getElementById('edit-process').value;
            let html = '';
            let processesToRender = currentModalProcess === 'tous' ? ['ventes', 'achat', 'prepa', 'service'] : [currentModalProcess];
            processesToRender.forEach(p => {
                appData[p].forEach(ind => {
                    if (currentModalFilter === 'major' && !ind.isMajor) return;
                    if (currentModalFilter === 'sub' && ind.isMajor) return;
                    let val = ind.targets[currentModalMonth];
                    html += `<div><label class="text-xs font-bold text-muted mb-1 block">${t(ind.id + '_title')} (${ind.unit})</label><input type="number" step="0.01" id="target-${p}-${ind.id}" value="${val.toFixed(2)}" class="w-full p-2 rounded input-field"></div>`;
                });
            });
            document.getElementById('target-inputs').innerHTML = html;
        }
        function saveTargets() {
            const user = document.getElementById('user-display').innerText;
            const now = new Date().toLocaleString();
            let processesToRender = currentModalProcess === 'tous' ? ['ventes', 'achat', 'prepa', 'service'] : [currentModalProcess];
            processesToRender.forEach(p => {
                appData[p].forEach(ind => {
                    if (currentModalFilter === 'major' && !ind.isMajor) return;
                    if (currentModalFilter === 'sub' && ind.isMajor) return;
                    const inputEl = document.getElementById(`target-${p}-${ind.id}`);
                    if (!inputEl) return;
                    const newVal = parseFloat(inputEl.value);
                    const oldVal = ind.targets[currentModalMonth];
                    if (newVal !== oldVal) {
                        changeHistory.unshift({ date: now, user: user, process: p, indicator: t(ind.id + '_title'), month: 'M' + currentModalMonth, oldVal: oldVal.toFixed(2), newVal: newVal.toFixed(2) });
                        ind.targets[currentModalMonth] = newVal;
                    }
                });
            });
            localStorage.setItem('hp_history', JSON.stringify(changeHistory));
            closeTargetModal(); renderAll();
        }

        function openHistoryModal() {
            let html = '';
            if (changeHistory.length === 0) { html = `<p class="text-muted text-center py-4">${t('no_history')}</p>`; } 
            else {
                changeHistory.forEach(h => {
                    html += `<div class="p-3 border-l-4 border-amber-500 rounded text-sm flex justify-between items-center bg-gray-50 dark:bg-gray-800"><div><span class="text-xs text-muted">${h.date} ${t('by')} <b>${h.user}</b></span><br><b>${h.indicator}</b> (${h.month}) : <span class="text-red-500 line-through">${h.oldVal}</span> ➔ <span class="text-emerald-500 font-bold">${h.newVal}</span></div><div class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">${h.process.toUpperCase()}</div></div>`;
                });
            }
            document.getElementById('history-content').innerHTML = html; document.getElementById('history-modal').classList.remove('hidden');
        }
        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }

        function exportData() {
            const allData = [];
            const processes = ['ventes', 'achat', 'prepa', 'service'];
            processes.forEach(p => {
                appData[p].forEach(ind => {
                    let row = { 
                        "Processus": p, 
                        "Indicateur": t(ind.id + '_title'), 
                        "Formule": t(ind.id + '_formula'), 
                        "Unite": ind.unit, 
                        "Réalisé M0": ind.m0, 
                        "Réalisé M1": ind.m1 
                    };
                    for(let m=1; m<=12; m++) row[`Cible M${m}`] = parseFloat(ind.targets[m].toFixed(2));
                    allData.push(row);
                });
            });
            const ws = XLSX.utils.json_to_sheet(allData); const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Tableau_de_Bord");
            XLSX.writeFile(wb, "Hello_Pizza_Synthese_Complete.xlsx");
        }

        async function syncData() {
            const btn = document.getElementById('sync-btn'); const icon = document.getElementById('sync-icon'); const text = document.getElementById('sync-text');
            btn.disabled = true; btn.classList.replace('bg-blue-600', 'bg-blue-800'); icon.innerText = '⏳'; text.innerText = t('btn_sync') + '...';
            try {
                const urlN8N = 'https://TON-N8N-URL/webhook/hpizza-sync';
                if (urlN8N.includes('TON-N8N-URL')) { 
                    await new Promise(r => setTimeout(r, 1500)); 
                } else {
                    const response = await fetch(urlN8N, { method: 'GET', headers: { 'Accept': 'application/json' } });
                    if (!response.ok) throw new Error('Erreur réseau');
                    const json = await response.json();
                    if(json.ventes) { appData.ventes[0].m1 = json.ventes.m1; appData.ventes[1].m1 = json.ventes.cmd_m1; appData.ventes[2].m1 = json.ventes.ticket_m1; }
                    if(json.achat) { appData.achat[2].m1 = json.achat.dispo_m1; appData.achat[0].m1 = json.achat.r_nc_m1; appData.achat[1].m1 = json.achat.r_c_m1; }
                    if(json.prepa) { appData.prepa[0].m1 = json.prepa.temps_m1; appData.prepa[1].m1 = json.prepa.retard_m1; }
                    if(json.service) { appData.service[2].m1 = json.service.indice_m1; appData.service[0].m1 = json.service.retours_m1; }
                }
                renderAll();
                icon.innerText = '✅'; text.innerText = 'OK'; btn.classList.replace('bg-blue-800', 'bg-emerald-600');
            } catch (e) { icon.innerText = '⚠️'; text.innerText = 'Erreur'; btn.classList.replace('bg-blue-800', 'bg-red-600'); }
            finally { setTimeout(() => { btn.disabled = false; btn.classList.replace('bg-emerald-600', 'bg-blue-600'); btn.classList.replace('bg-red-600', 'bg-blue-600'); icon.innerText = '🔄'; text.innerText = t('btn_sync'); }, 3000); }
        }
        
        applyTranslations();
    </script>
